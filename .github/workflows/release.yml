# Tags and publishes a release when a merged release PR sets a new version.
# See "Versioning and releases" in CONTRIBUTING.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release run at a time, so two quick merges can't tag the same version twice
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The version in pyproject.toml, and whether its release already exists. The
      # release, not the tag, decides: a run that tagged but failed to publish
      # finishes the job when re-run.
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # The notes: the CHANGELOG section headed "## X.Y.Z", up to the next "## "
      - name: Extract the release notes
        if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { inside = ($2 == v); found = found || inside; next }
            inside { print }
            END { exit !found }
          ' CHANGELOG.md > notes.md || {
            echo "::error::CHANGELOG.md has no '## $VERSION' section; not releasing v$VERSION."
            exit 1
          }

      # Annotated, so that `git describe` (the recorded code version) sees it. An
      # error reaching the remote fails the step rather than reading as "no tag".
      - name: Tag and publish
        if: steps.version.outputs.released == 'false'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -z "$remote_tag" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
