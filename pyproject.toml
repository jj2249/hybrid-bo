[project]
authors = [
    { name = "Luis Kutschat", email = "luis.kutschat@avt.rwth-aachen.de" },
    { name = "Eike Cramer", email = "e.cramer@ucl.ac.uk" },
    { name = "Joel Paulson", email = "joel.paulson@wisc.edu" },
    { name = "Alexander Mitsos", email = "alexander.Mitsos@avt.rwth-aachen.de" },
    { name = "Joseph Johnson", email = "joseph.johnson.26@ucl.ac.uk" },
]
dependencies = ["casadi>=3.8.1,<4", "numpy>=2.5.3,<3", "scipy>=1.18.1,<2"]
name = "hybrid-bo"
requires-python = ">= 3.12"
version = "0.1.0"
description = "A package for performing hybrid Bayesian optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
hybrid_bo = { path = ".", editable = true }

[tool.pixi.feature.quality.dependencies]
ruff = ">=0.16.10,<0.17"
ty = ">=0.0.85,<0.0.86"
pre-commit = ">=4.6.2,<5"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"

[tool.pixi.feature.quality.tasks]
lint = "ruff check --fix"
format = "ruff format"
typecheck = "ty check"
test = "pytest"
coverage = "pytest --cov=hybrid_bo --cov-report=term-missing"
check = { depends-on = ["lint", "format", "typecheck"] }
setup-hooks = "pre-commit install"
setup = { depends-on = ["setup-hooks"] }

[tool.pixi.feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
sphinx-autoapi = ">=3.8.1,<4"
furo = ">=2025.12.19,<2026"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -b html docs docs/_build/html"

[tool.pixi.feature.examples.dependencies]
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"

[tool.pixi.environments]
default = { solve-group = "default" }
examples = { features = ["quality", "docs", "examples"], solve-group = "default" }
dev = { features = ["quality", "docs", "examples"], solve-group = "default" }
# examples deps are needed so ty can resolve matplotlib/yaml imports in examples/
quality = { features = ["quality", "examples"], solve-group = "default" }

[tool.ruff]
# Match the Python version used by your project.
target-version = "py312"
line-length = 88

# Add to Ruff's default exclusions.
extend-exclude = [".pixi"]

[tool.ruff.lint]
# TRY002/BLE001: replacing bare `Exception`s and blanket excepts is a logic change (ROADMAP stage 5)
ignore = ["E501", "TRY002", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Re-exports define the public API
"__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes and standard Ruff formatting.
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Examples are imported as top-level packages, as in examples/main.py
pythonpath = ["examples"]

[tool.ty.environment]
python-version = "3.12"
# Mirrors pytest `pythonpath`: examples are imported as top-level packages
extra-paths = ["examples"]

[tool.ty.src]
# Type-check the application source.
exclude = [".pixi"]
