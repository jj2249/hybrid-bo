[project]
authors = [
    { name = "Luis Kutschat", email = "luis.kutschat@avt.rwth-aachen.de" },
    { name = "Eike Cramer", email = "e.cramer@ucl.ac.uk" },
    { name = "Joel Paulson", email = "joel.paulson@wisc.edu" },
]
dependencies = [
    "casadi>=3.7.2,<4",
    "numpy>=2.4.1,<3",
    "scipy>=1.15",
    "matplotlib>=3.10.8,<4",
    "pyyaml>=6.0.3,<7",
]
name = "hybrid-bo"
requires-python = ">= 3.12"
version = "0.1.0"
description = "A package for performing hybrid Bayesian optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
hybrid_bo = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[dependency-groups]
docs = ["sphinx", "sphinx-autoapi", "furo"]
