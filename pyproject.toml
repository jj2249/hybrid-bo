[project]
authors = [
    { name = "Luis Kutschat", email = "luis.kutschat@avt.rwth-aachen.de" },
    { name = "Eike Cramer", email = "e.cramer@ucl.ac.uk" },
    { name = "Joel Paulson", email = "joel.paulson@wisc.edu" },
    { name = "Alexander Mitsos", email = "alexander.Mitsos@avt.rwth-aachen.de" },
    { name = "Joseph Johnson", email = "joseph.johnson.26@ucl.ac.uk" },
]
dependencies = ["casadi>=3.8.1,<4", "numpy>=2.5.3,<3"]
name = "hybrid-bo"
requires-python = ">= 3.12"
version = "0.1.0"
description = "A package for performing hybrid Bayesian optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
# conda-forge's Python 3.15 on Windows installs to lib/python/site-packages,
# which ty can't find yet. Lift the cap once ty supports that layout.
python = ">=3.12,<3.15"

[tool.pixi.pypi-dependencies]
hybrid_bo = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.16.10,<0.17"
ty = ">=0.0.85,<0.0.86"
pre-commit = ">=4.6.2,<5"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
matplotlib = ">=3.11.2,<4"
scipy = ">=1.18.1,<2"
sphinx = ">=9.1.0,<10"
sphinx-autoapi = ">=3.8.1,<4"
furo = ">=2025.12.19,<2026"

[tool.pixi.feature.dev.tasks]
lint = "ruff check --fix"
format = "ruff format"
typecheck = "ty check"
test = "pytest"
coverage = "coverage run -m pytest && coverage report --show-missing && coverage html"
check = { depends-on = ["lint", "format", "typecheck"] }
setup-hooks = "pre-commit install"
setup = { depends-on = ["setup-hooks"] }
docs = "sphinx-build -W -b html docs docs/_build/html"

[tool.pixi.environments]
# The library only
default = { solve-group = "default" }
# Working on the library: adds tests, lint, type check, matplotlib and the docs
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
# Match the Python version used by your project.
target-version = "py312"
line-length = 88

# Add to Ruff's default exclusions
extend-exclude = [".pixi"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hybrid_bo"]

[tool.ruff.lint.per-file-ignores]
# Re-exports define the public API
"__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes and standard Ruff formatting.
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test helpers are imported as top-level modules
pythonpath = ["tests"]

[tool.coverage.run]
source = ["hybrid_bo"]

[tool.ty.environment]
python-version = "3.12"
# Mirrors pytest `pythonpath`: the test helpers are top-level modules
extra-paths = ["tests"]

[tool.ty.src]
# As Ruff's exclusions
exclude = [".pixi"]
