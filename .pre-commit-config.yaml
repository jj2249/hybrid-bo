repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: pixi run -e dev lint
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: pixi run -e dev format
        language: system
        types: [python]

      - id: ty
        name: ty type check
        entry: pixi run -e dev typecheck
        language: system
        types: [python]
        pass_filenames: false
